name: myridedriverapp
description: "NRide Driver - Accept rides, navigate to passengers, and manage your earnings."
publish_to: 'none'

version: 1.0.36+37

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  get: ^4.7.3
  http: ^1.6.0
  google_places_flutter: ^2.1.1
  intl_phone_field: ^3.2.0
  image_picker: ^1.2.1
  pinput: ^6.0.2
  intl: ^0.20.2
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  fl_chart: ^1.2.0
  lottie: ^3.3.2
  table_calendar: ^3.2.0
  audioplayers: ^6.6.0
  flutter_polyline_points: ^3.1.0
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  flutter_easyloading: ^3.0.5
  firebase_messaging: ^16.1.3
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  device_info_plus: ^12.4.0
  flutter_image_compress: ^2.4.0
  flutter_html: ^3.0.0
  photo_view: ^0.15.0
  google_sign_in: ^6.1.5
  flutter_local_notifications: ^20.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_spinkit: ^5.2.2
  qr_flutter: ^4.1.0
  razorpay_flutter: ^1.3.7
  video_player: ^2.10.1
  file_picker: ^11.0.2
  # flutter_facebook_auth: ^7.1.6
  # Floating "return to app" bubble shown over Google Maps during a live ride
  # — the SYSTEM_ALERT_WINDOW overlay itself (Uber/Rapido-style).
  flutter_overlay_window: ^0.5.0
  # Google's own Navigation SDK for Flutter — full turn-by-turn guidance
  # rendered INSIDE this app, so the driver never leaves it for the Google
  # Maps app at all. This is the structural fix for the return-to-app problem
  # the bubble and the notification above only ever mitigated: a driver who
  # never leaves cannot be stranded outside.
  #
  # Requires "Navigation SDK for Android" to be enabled on the Google Cloud
  # project behind ANDROID_MAPS_API_KEY, and billing on that project. Since
  # Q3 2024 this is self-serve — a Mobility/ODRD agreement is no longer
  # required — but it is NOT free beyond the monthly free tier. See
  # InAppNavigationService, which falls back to the external-Maps handoff
  # whenever the SDK reports the key isn't authorised, so an unprovisioned
  # build still ships working navigation.
  # Range rather than a caret: 0.11.x requires Flutter >=3.44 and this app is
  # on 3.35.1. Pub picks the newest release that this SDK actually supports.
  # Revisit the ceiling when the Flutter version moves.
  google_navigation_flutter: ">=0.7.0 <0.12.0"
  # Backs OTP SMS autofill via Android's SMS User Consent API — the API
  # Pinput's own `smsRetriever` hook is designed around. Replaces
  # sms_autofill, which used the SMS Retriever API and so required the
  # backend to append this app's signing-key hash to every OTP message.
  smart_auth: ^3.2.0
  # Reads the app's own installed version number for the Play Store
  # version-check on launch (see VersionCheckService).
  package_info_plus: ^9.0.1

# Vendored so two upstream bugs could be fixed at source rather than worked
# around: showOverlay() started its (already foreground) service with
# startService(), which Android forbids from the background and so broke the
# ride-request overlay in exactly the app-closed case it exists for; and
# closeOverlay() never completed its MethodChannel result when no overlay was
# showing, hanging the caller forever. Both are marked NRIDE PATCH in
# packages/flutter_overlay_window. Upstream is 0.5.0 and unchanged since
# Apr 2025 — re-check those two patches if this is ever bumped.
dependency_overrides:
  flutter_overlay_window:
    path: packages/flutter_overlay_window

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.7
  image: ^4.8.0

flutter_native_splash:
  color: "#0B225F"
  fullscreen: true
  android_12:
    color: "#0B225F"
    icon_background_color: "#0B225F"

flutter_launcher_icons:
  image_path: "assets/images/N driver app icon white v1_zoomed.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0B225F"
  adaptive_icon_foreground: "assets/images/N driver app icon white v1_zoomed.png"
  web:
    generate: true
    image_path: "assets/images/N driver app icon white v1_zoomed.png"
    background_color: "#123EBC"
    theme_color: "#123EBC"
  windows:
    generate: true
    image_path: "assets/images/N driver app icon white v1_zoomed.png"
  macos:
    generate: true
    image_path: "assets/images/N driver app icon white v1_zoomed.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/splash_frames/
    - assets/sound/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
